<section class="brand-video">
  <div class="container">
    <div class="row align-items-center gy-5">
      <div class="col-lg-6">
        <div class="brand-video-copy">
          <p class="brand-video-eyebrow">{{ heading() }}</p>
          <h2 class="brand-video-heading">
            The <span class="brand-video-heading-accent">trusted</span> supply partner behind UAE's networks.
          </h2>
          <p class="brand-video-text">{{ body() }}</p>
          <a class="btn btn--primary btn--lg" href="/products">Explore Our Products</a>
        </div>
      </div>

      <div class="col-lg-6">
        <p class="brand-video-watch-label">
          <span class="brand-video-watch-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M4 2.5v9l8-4.5-8-4.5z" fill="currentColor" />
            </svg>
          </span>
          Watch Video
        </p>
        <div class="brand-video-player">
          <video
            class="brand-video-el"
            src="/Videos/rychlost-intro.mp4"
            poster="/Videos/rychlost-intro-poster.jpg"
            controls
            preload="metadata"
            playsinline
          >
            Your browser doesn't support embedded video.
            <a href="/Videos/rychlost-intro.mp4">Download the video</a> instead.
          </video>
        </div>
      </div>
    </div>
  </div>
</section>
